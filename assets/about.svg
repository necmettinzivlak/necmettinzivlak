    <!-- Line 9: devops -->
    <text x="66" y="261">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#7ee787">devops</tspan><tspan fill="#c9d1d9">:    [</tspan><tspan fill="#a5d6ff">"Docker"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Git"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"CI/CD"</tspan><tspan fill="#c9d1d9">],</tspan>
    </text>

    <!-- Line 10: closing brace -->
    <text x="66" y="283">
      <tspan fill="#c9d1d9">    },</tspan>
    </text>

