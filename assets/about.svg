    <!-- Line 8: backend -->
    <text x="66" y="239">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#7ee787">backend</tspan><tspan fill="#c9d1d9">:   [</tspan><tspan fill="#a5d6ff">"Node.js"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Express"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"PostgreSQL"</tspan><tspan fill="#c9d1d9">],</tspan>
