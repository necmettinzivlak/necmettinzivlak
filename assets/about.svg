  <circle cx="36" cy="32" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="32" r="7" fill="#febc2e"/>
  <circle cx="80" cy="32" r="7" fill="#28c840"/>

  <!-- Tab -->
  <text x="410" y="37" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#8b949e" text-anchor="middle">about.ts</text>

