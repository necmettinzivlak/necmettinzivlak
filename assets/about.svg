      <tspan fill="#c9d1d9">        </tspan><tspan fill="#7ee787">mobile</tspan><tspan fill="#c9d1d9">:    [</tspan><tspan fill="#a5d6ff">"Flutter"</tspan><tspan fill="#c9d1d9">],</tspan>
