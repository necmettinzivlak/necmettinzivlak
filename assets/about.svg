      <tspan fill="#c9d1d9">        </tspan><tspan fill="#7ee787">frontend</tspan><tspan fill="#c9d1d9">:  [</tspan><tspan fill="#a5d6ff">"React"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Next.js"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"TypeScript"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Vite"</tspan><tspan fill="#c9d1d9">],</tspan>
