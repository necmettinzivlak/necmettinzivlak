      <tspan fill="#c9d1d9">    </tspan><tspan fill="#7ee787">experience</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"3+ years"</tspan><tspan fill="#c9d1d9">,</tspan>
