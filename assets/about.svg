      <tspan fill="#ff7b72">const</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#79c0ff">necmettin</tspan><tspan fill="#c9d1d9"> = {</tspan>
    </text>

    <!-- Line 2: role -->
    <text x="66" y="107">
      <tspan fill="#c9d1d9">    </tspan><tspan fill="#7ee787">role</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Frontend &amp; Mobile Engineer"</tspan><tspan fill="#c9d1d9">,</tspan>
