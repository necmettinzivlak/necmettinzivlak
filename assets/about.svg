    <text x="66" y="305">
      <tspan fill="#c9d1d9">    </tspan><tspan fill="#7ee787">domains</tspan><tspan fill="#c9d1d9">: [</tspan>
    </text>

    <!-- Line 12 -->
    <text x="66" y="327">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#a5d6ff">"Fintech &amp; Trading Platforms"</tspan><tspan fill="#c9d1d9">,</tspan>
    </text>

    <!-- Line 13 -->
    <text x="66" y="349">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#a5d6ff">"Real-Time Data Visualization"</tspan><tspan fill="#c9d1d9">,</tspan>
    </text>

    <!-- Line 14 -->
    <text x="66" y="371">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#a5d6ff">"GPS &amp; Fleet Management"</tspan><tspan fill="#c9d1d9">,</tspan>
    </text>

    <!-- Line 15 -->
    <text x="66" y="393">
      <tspan fill="#c9d1d9">        </tspan><tspan fill="#a5d6ff">"Enterprise Operational Tools"</tspan><tspan fill="#c9d1d9">,</tspan>
    </text>

    <!-- Line 16: closing bracket -->
    <text x="66" y="415">
      <tspan fill="#c9d1d9">    ],</tspan>
    </text>

    <!-- Line 17: closing brace -->
    <text x="66" y="437">
      <tspan fill="#c9d1d9">};</tspan>
