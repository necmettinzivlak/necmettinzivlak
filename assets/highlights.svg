<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="100%" height="100%">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card-bg {
        fill: #090a0f;
        stroke: #ffffff;
        stroke-opacity: 0.1;
        stroke-width: 1.2;
      }
      .glow-line {
        animation: slideGlow 8s ease-in-out infinite alternate;
      }
      .candle-1 { animation: pulseY 3s ease-in-out infinite alternate; transform-origin: center; }
      .candle-2 { animation: pulseY 4s ease-in-out infinite alternate-reverse; transform-origin: center; }
      .candle-3 { animation: pulseY 2.5s ease-in-out infinite alternate; transform-origin: center; }
      .radar-ring {
        animation: radarPing 3.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: 350px 52px;
      }
      .stream-dot {
        animation: streamFlow 2.5s linear infinite;
      }
      .crosshair-move {
        animation: panCrosshair 6s ease-in-out infinite alternate;
      }
      @keyframes slideGlow {
        0% { transform: translateX(-30px); opacity: 0.3; }
        100% { transform: translateX(30px); opacity: 0.8; }
      }
      @keyframes pulseY {
        0% { transform: scaleY(0.85); }
        100% { transform: scaleY(1.18); }
      }
      @keyframes radarPing {
        0% { transform: scale(0.4); opacity: 0.9; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes panCrosshair {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-24px, 8px); }
      }
    </style>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <linearGradient id="top-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="silver-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g class="font-sans">
    <!-- KART 1: CUSTOM CANVAS ENGINE -->
    <g transform="translate(0, 10)">
      <rect width="408" height="210" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />
      <line x1="60" y1="0" x2="348" y2="0" stroke="url(#top-highlight)" stroke-width="2" class="glow-line" />

      <text x="28" y="42" fill="#71717a" font-size="11" font-weight="700" letter-spacing="2.5">HIGH-FREQUENCY RENDERING</text>
      <text x="28" y="74" fill="#ffffff" font-size="21" font-weight="700">Custom Canvas Engine</text>
      <text x="28" y="102" fill="#a1a1aa" font-size="14">60fps pan, zoom, dynamic crosshair</text>
      <text x="28" y="124" fill="#a1a1aa" font-size="14">80+ indicators  /  90+ drawing tools</text>

      <!-- Alt Etiket -->
      <rect x="28" y="152" width="165" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="42" cy="166" r="3.5" fill="#38bdf8" />
      <text x="54" y="170" fill="#e4e4e7" font-size="12" font-weight="500">Flutter CustomPainter</text>

      <!-- Animasyonlu Mini Grafik İkonu (Sağ Üst) -->
      <g transform="translate(310, 24)">
        <line x1="12" y1="8" x2="12" y2="42" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
        <rect x="8" y="14" width="8" height="18" rx="1.5" fill="#38bdf8" class="candle-1" />

        <line x1="28" y1="4" x2="28" y2="38" stroke="#f4f4f5" stroke-width="1.5" opacity="0.5" />
        <rect x="24" y="10" width="8" height="16" rx="1.5" fill="#f4f4f5" class="candle-2" />

        <line x1="44" y1="10" x2="44" y2="46" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
        <rect x="40" y="16" width="8" height="22" rx="1.5" fill="#38bdf8" class="candle-3" />

        <g class="crosshair-move">
          <line x1="0" y1="22" x2="60" y2="22" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
          <line x1="36" y1="0" x2="36" y2="48" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />
          <circle cx="36" cy="22" r="2.5" fill="#ffffff" />
        </g>
      </g>
    </g>

    <!-- KART 2: REALTIME WEBSOCKET STREAMS -->
    <g transform="translate(436, 10)">
      <rect width="408" height="210" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />
      <line x1="60" y1="0" x2="348" y2="0" stroke="url(#silver-highlight)" stroke-width="2" class="glow-line" />

      <text x="28" y="42" fill="#71717a" font-size="11" font-weight="700" letter-spacing="2.5">LOW-LATENCY ARCHITECTURE</text>
      <text x="28" y="74" fill="#ffffff" font-size="21" font-weight="700">Realtime Market Streams</text>
      <text x="28" y="102" fill="#a1a1aa" font-size="14">Binance, Bitget, Bybit live WebSockets</text>
      <text x="28" y="124" fill="#a1a1aa" font-size="14">Liquidation heatmaps  /  Whale trackers</text>

      <rect x="28" y="152" width="172" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="42" cy="166" r="3.5" fill="#e4e4e7" />
      <text x="54" y="170" fill="#e4e4e7" font-size="12" font-weight="500">Riverpod + Clean Arch</text>

      <!-- Animasyonlu Veri Akışı Dalga Çizgisi -->
      <g transform="translate(300, 28)">
        <path d="M 0,25 Q 18,5 35,25 T 70,25" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
        <path d="M 0,25 Q 18,5 35,25 T 70,25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="15 45" class="stream-dot" />
        <circle cx="70" cy="25" r="3" fill="#38bdf8" />
      </g>
    </g>

    <!-- KART 3: LIVE TELEMETRY & MAPS -->
    <g transform="translate(872, 10)">
      <rect width="408" height="210" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />
      <line x1="60" y1="0" x2="348" y2="0" stroke="url(#top-highlight)" stroke-width="2" class="glow-line" />

      <text x="28" y="42" fill="#71717a" font-size="11" font-weight="700" letter-spacing="2.5">SPATIAL INTERFACES</text>
      <text x="28" y="74" fill="#ffffff" font-size="21" font-weight="700">Live Fleet  /  Telemetry</text>
      <text x="28" y="102" fill="#a1a1aa" font-size="14">Real-time tracking for 100s of units</text>
      <text x="28" y="124" fill="#a1a1aa" font-size="14">9 enterprise products shipped at scale</text>

      <rect x="28" y="152" width="184" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="42" cy="166" r="3.5" fill="#38bdf8" />
      <text x="54" y="170" fill="#e4e4e7" font-size="12" font-weight="500">React + TypeScript + GIS</text>

      <!-- Animasyonlu Radar Noktası -->
      <circle cx="350" cy="52" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-ring" />
      <circle cx="350" cy="52" r="4.5" fill="#38bdf8" />
      <circle cx="350" cy="52" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 3" />
    </g>
  </g>
</svg>
